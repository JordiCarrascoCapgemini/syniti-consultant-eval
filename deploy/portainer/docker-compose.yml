# Portainer CE - the management plane for POCDAPP314.
#
# This is the ONE stack deployed from the command line, because Portainer cannot
# deploy itself. Every other stack, including the Skills Evaluation app, is then
# deployed through Portainer as a git-backed stack.
#
# SECURITY: this container mounts the Docker socket, which makes it
# root-equivalent on the host. It cannot be mounted read-only - Portainer needs
# write access to create and manage containers, which is the entire point. The
# consequences:
#   - the UI is published on LOOPBACK ONLY and reached through nginx
#     (deploy/nginx/portainer.conf), never directly on the network;
#   - that vhost should carry an IP allow-list for the admin subnet;
#   - the admin password is as sensitive as root on this box.
#
# PREREQUISITE - create the admin password file first, or the bind mount below
# fails and the container will not start:
#
#   sudo mkdir -p /etc/portainer
#   printf '%s' 'YOUR_PASSWORD' | sudo tee /etc/portainer/admin_password >/dev/null
#   sudo chmod 600 /etc/portainer/admin_password
#
# Minimum 12 characters. Generate with: openssl rand -base64 24
#
# Deploy:
#   cd deploy/portainer && docker compose up -d
#
# The admin account is created at startup from that file, so there is no
# interactive setup window to beat. Portainer otherwise disables initial setup a
# few minutes after first start, which is easy to hit when reaching the UI needs
# an SSH tunnel; recovery would mean restarting the container.
#
# Portainer reads the file only when initialising. Once you have logged in
# successfully, delete it - it holds a root-equivalent secret in plaintext:
#   sudo rm -f /etc/portainer/admin_password

services:
  portainer:
    # Pinned deliberately. ":latest" on a root-equivalent admin plane means an
    # unreviewed image can arrive on any redeploy. Check for a newer patch
    # release before first install, then bump this on purpose.
    image: portainer/portainer-ce:2.21.4
    # Creates the admin account non-interactively at first start. Ignored on
    # later starts once an admin exists, so it is safe to leave in place.
    command: --admin-password-file /run/secrets/portainer_admin
    ports:
      # HTTP on loopback only; nginx terminates TLS in front. Portainer's own
      # 9443 HTTPS listener is deliberately NOT published - one certificate
      # story, no TLS inside TLS.
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      # Read-only bind of the password file. Must exist before first up, or
      # Docker creates a DIRECTORY at that path and Portainer fails to start.
      - /etc/portainer/admin_password:/run/secrets/portainer_admin:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portainer_data:
