# Content-Security-Policy for OUR single-file apps only.
# Do NOT include this in a third-party UI vhost (Portainer, Grafana, and similar
# bundled front ends need their own policy and will break under this one).

add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

# NOTE on 'unsafe-inline': both apps are single-file HTML with one large inline
# <script>, inline <style>, and a base64 data: logo. A strict policy breaks them
# outright. Removing 'unsafe-inline' needs either per-deploy script hashes or
# extracting the script to a served .js file, and the latter ends the "portable
# single file" property that decision 1 protects. Knowing trade-off, not an
# oversight - see deploy/DEPLOY-POCDAPP314.md section 8.
#
# CAUTION: add_header does not merge across levels. If a location block adds any
# header of its own, nginx drops every add_header inherited from the server
# block, this CSP included. Re-include both snippets inside such a location.
