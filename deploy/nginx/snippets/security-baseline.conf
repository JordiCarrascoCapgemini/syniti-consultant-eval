# Baseline response headers, safe for ANY vhost including third-party UIs.
# Deliberately contains no Content-Security-Policy: a CSP has to be tuned per
# application, and a policy written for our apps breaks Portainer's UI. App CSP
# lives in csp-apps.conf and is included only by our own vhosts.

# HSTS. Safe because port 80 only ever issues a redirect to 443.
# No "preload" and no includeSubDomains on purpose: this is an internal POC host
# and a subdomain-wide commitment would affect names we do not control.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
