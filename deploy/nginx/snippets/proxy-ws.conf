# Proxy parameters for an upstream that needs WebSockets.
#
# Use this INSTEAD OF proxy-app.conf where the upstream upgrades connections.
# The difference that matters: proxy-app.conf sets `Connection ""` to enable
# upstream keepalive, which silently breaks the WebSocket handshake. Here the
# Connection header is driven by $connection_upgrade instead.
#
# Requires this map in the http context (see 00-default.conf, which defines it
# once for the whole server):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 5s;
proxy_send_timeout    3600s;
# Long read timeout so an idle container console or a live log stream is not cut
# off after a minute. This is why it is a separate snippet from proxy-app.conf.
proxy_read_timeout    3600s;

proxy_buffering off;
proxy_intercept_errors off;
