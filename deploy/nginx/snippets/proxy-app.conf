# Shared proxy parameters for a containerised app on loopback.
# Included inside a location block by every application vhost.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# The app reads this to know the client spoke HTTPS even though this hop is HTTP.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Upstream keepalive needs Connection cleared.
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Do not buffer the response to disk; these are small JSON and HTML payloads.
proxy_buffering off;

# Never let nginx rewrite an upstream error into its own page: the API returns
# meaningful JSON bodies on 401 and 422 that the apps parse and display.
proxy_intercept_errors off;
