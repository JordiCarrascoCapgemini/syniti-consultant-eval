# Skills Evaluation & Enablement - nginx vhost on POCDAPP314 (10.21.12.62)
#
# Install as /etc/nginx/conf.d/skills-eval.conf
#
# ONE FILE PER APPLICATION. To onboard the next app (dq-studio), copy this file
# and change exactly four things:
#   1. server_name
#   2. the two ssl_certificate paths
#   3. the upstream name and its 127.0.0.1 port
#   4. the two access/error log paths
# Nothing else needs to differ, and no other app's file is touched.
#
# PLACEHOLDER: skills-eval.poclab.local is a guess. Replace it with the real
# POCLAB DNS zone before use. It appears in server_name, both cert paths, and
# the log paths.

upstream skills_eval {
    # The app publishes ONLY on loopback (see docker-compose.yml), so nginx is
    # the sole path in. Port allocations are registered in
    # deploy/DEPLOY-POCDAPP314.md - do not reuse a port.
    server 127.0.0.1:8001 fail_timeout=10s;
    keepalive 16;
}

# --- plain HTTP: redirect only, never serves the app --------------------------
server {
    listen      80;
    listen [::]:80;
    server_name skills-eval.poclab.local;

    # Access logged separately so a spike of plain-HTTP hits is visible.
    access_log /var/log/nginx/skills-eval.http.access.log;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the real vhost ---------------------------------------------------
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1 syntax. On an older nginx this line fails to load; use
    # "listen 443 ssl http2;" above and delete this line instead.
    http2 on;

    server_name skills-eval.poclab.local;

    ssl_certificate     /etc/nginx/certs/skills-eval.poclab.local.crt;
    ssl_certificate_key /etc/nginx/certs/skills-eval.poclab.local.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    include /etc/nginx/snippets/security-baseline.conf;
    include /etc/nginx/snippets/csp-apps.conf;

    access_log /var/log/nginx/skills-eval.access.log;
    error_log  /var/log/nginx/skills-eval.error.log warn;

    # Evaluation payloads are tens of KB; 2m is generous headroom. The team app
    # reads its import files client-side, so nothing large is ever uploaded.
    client_max_body_size 2m;

    # The eval app at /, the team summary at /team, the API under /api.
    location / {
        include    /etc/nginx/snippets/proxy-app.conf;
        proxy_pass http://skills_eval;
    }

    # Same upstream, but kept out of the access log and given a short timeout so
    # a monitoring poll cannot hold a worker. Unauthenticated by design - the
    # container healthcheck depends on that.
    location = /api/health {
        include    /etc/nginx/snippets/proxy-app.conf;
        proxy_pass http://skills_eval;

        access_log off;
        proxy_read_timeout 5s;
    }
}

# A catch-all default server is required alongside this file so that a request
# to the bare IP or an unknown Host does not fall through to this app. It ships
# separately as deploy/nginx/00-default.conf and is installed once, not per app.
