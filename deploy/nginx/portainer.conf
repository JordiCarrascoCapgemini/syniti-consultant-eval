# Portainer CE management UI - nginx vhost on POCDAPP314 (10.21.12.62)
#
# Install as /etc/nginx/conf.d/portainer.conf
#
# THIS IS AN ADMIN PLANE, NOT AN APPLICATION. Portainer holds the Docker socket,
# which makes it root-equivalent on this host: anyone who reaches this UI and
# authenticates can start a privileged container and own the box. Treat this file
# as more sensitive than any application vhost.
#
# PLACEHOLDER: portainer.poclab.local is a guess. Replace with the real POCLAB
# zone in server_name, both cert paths and the log paths.

upstream portainer_ui {
    # Portainer's plain-HTTP port, published on loopback only. Proxying to 9000
    # rather than its self-signed 9443 avoids TLS-inside-TLS and keeps one
    # certificate story: nginx terminates, the loopback hop is plain.
    # Ports are registered in deploy/DEPLOY-POCDAPP314.md section 2.1.
    server 127.0.0.1:9000 fail_timeout=10s;
    # No keepalive here on purpose - this upstream carries WebSocket upgrades.
}

server {
    listen      80;
    listen [::]:80;
    server_name portainer.poclab.local;

    access_log /var/log/nginx/portainer.http.access.log;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1. On older nginx use "listen 443 ssl http2;" and drop this.
    http2 on;

    server_name portainer.poclab.local;

    ssl_certificate     /etc/nginx/certs/portainer.poclab.local.crt;
    ssl_certificate_key /etc/nginx/certs/portainer.poclab.local.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Baseline headers ONLY. The app CSP (csp-apps.conf) must NOT be included
    # here: Portainer is a bundled Angular front end and a policy written for our
    # single-file apps breaks it.
    include /etc/nginx/snippets/security-baseline.conf;

    access_log /var/log/nginx/portainer.access.log;
    error_log  /var/log/nginx/portainer.error.log warn;

    # Portainer can upload images and archives through the UI.
    client_max_body_size 512m;

    # ACTION (security): restrict this admin plane to the administrator subnet.
    # Uncomment and set the real range before exposing Portainer. An allow-list
    # here is cheap and is the difference between "an admin console on the lab
    # network" and "a root shell on the lab network".
    #
    # allow 10.21.12.0/24;
    # deny  all;

    location / {
        # proxy-ws.conf, NOT proxy-app.conf. Portainer needs WebSockets for
        # container consoles and live log streaming, and proxy-app.conf sets
        # Connection "" for upstream keepalive, which breaks the upgrade.
        include    /etc/nginx/snippets/proxy-ws.conf;
        proxy_pass http://portainer_ui;
    }
}
