# Catch-all default server. Install ONCE as /etc/nginx/conf.d/00-default.conf,
# not per application. The 00- prefix makes it load first.
#
# Why this exists: without an explicit default_server, nginx answers an unknown
# Host header (or a request straight to https://10.21.12.62/) using whichever
# vhost loaded first. That would quietly serve the Skills Evaluation app on a
# name it was never meant to answer, and on the bare IP. This returns 404 for
# anything that does not match a real application hostname.
#
# The certificate here is only ever presented to clients connecting by IP or by
# a wrong name, so a self-signed one is fine and a warning is the correct signal:
#   openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
#     -keyout /etc/nginx/certs/default.key \
#     -out    /etc/nginx/certs/default.crt \
#     -subj "/CN=invalid.poclab.local"
#   chmod 600 /etc/nginx/certs/default.key

# WebSocket upgrade map, defined ONCE for the whole server. conf.d/*.conf is
# included inside the http context, so a map at this level is valid. Required by
# snippets/proxy-ws.conf, which the Portainer vhost uses.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80  default_server;
    listen [::]:80  default_server;
    server_name _;

    access_log /var/log/nginx/default.access.log;
    return 404;
}

server {
    listen      443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/default.crt;
    ssl_certificate_key /etc/nginx/certs/default.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/default.access.log;
    return 404;
}
